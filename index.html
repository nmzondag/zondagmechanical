<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://ajax.googleapis.com/ajax/libs/model-viewer/v3.5.0/model-viewer.min.js" type="module"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
        }
        
        /* Minimal loading spinner (visual only) */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.15);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 100;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="position: relative; width: 100%; height: 100%;">
        <!-- Loading spinner -->
        <div class="loading" id="loader"></div>
        
        <!-- SolidWorks GLB Model Viewer -->
        <model-viewer 
            id="modelViewer"
            src="TWR-16 FRONT WING MASTER.glb"
            alt=""
            camera-controls
            auto-rotate
            auto-rotate-delay="2000"
            rotation-per-second="20deg"
            shadow-intensity="1.2"
            exposure="0.9"
            environment-intensity="0.8"
            loading="eager"
            ar
            ar-modes="webxr scene-viewer quick-look">
        </model-viewer>
    </div>

    <script>
        const modelViewer = document.getElementById('modelViewer');
        const loader = document.getElementById('loader');
        
        // Show spinner until model is fully loaded
        loader.style.display = 'block';
        
        modelViewer.addEventListener('load', () => {
            loader.style.display = 'none';
            console.log('Model loaded successfully');
        });
        
        // Fallback: hide spinner after 15 seconds in case of error
        setTimeout(() => {
            if (loader.style.display !== 'none') {
                loader.style.display = 'none';
            }
        }, 15000);
        
        // Double-click anywhere for fullscreen
        document.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });
        
        // Press F key for fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://ajax.googleapis.com/ajax/libs/model-viewer/v3.5.0/model-viewer.min.js" type="module"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
        }
        
        /* Minimal loading indicator (visual only) */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="position: relative; width: 100%; height: 100%;">
        <!-- Loading spinner -->
        <div class="loading" id="loader"></div>
        
        <!-- Interactive SolidWorks model viewer. Replace src- "SOLIDWORKS MODEL.glb". Add glb file to github repo. Use solidworks visualize, export as extended reality, GLB -->
        <model-viewer 
            id="modelViewer"
            src="TWR-16 FRONT WING MASTER.glb" 
            alt=""
            auto-rotate
            camera-controls
            shadow-intensity="1"
            exposure="1"
            environment-intensity="1"
            style="width: 100%; height: 100%;"
            loading="eager">
        </model-viewer>
    </div>

    <script>
        const modelViewer = document.getElementById('modelViewer');
        const loader = document.getElementById('loader');
        
        // Show loader until model is ready
        loader.style.display = 'block';
        
        modelViewer.addEventListener('load', () => {
            loader.style.display = 'none';
        });
        
        // Optional: Double-click for fullscreen
        document.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
        
        // Press F for fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
